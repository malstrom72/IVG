name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1        # sets up cl.exe for VS 2022 x64
    - name: Build & test
      shell: pwsh
      run: |
        .\build.cmd | Tee-Object -FilePath build.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (Select-String -LiteralPath build.log -SimpleMatch '=== ALL BUILDS AND TESTS COMPLETED SUCCESSFULLY ===' -Quiet)) {
          throw 'build.cmd exited 0 without printing the completion line'
        }
    - name: Replay the fuzz corpus
      shell: cmd
      run: tools\replayFuzzCorpus.cmd

  macos-clang:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build & test
      shell: bash
      run: |
        bash build.sh 2>&1 | tee build.log
        grep -qF '=== ALL BUILDS AND TESTS COMPLETED SUCCESSFULLY ===' build.log
    - name: Replay the fuzz corpus
      shell: bash
      run: bash tools/replayFuzzCorpus.sh

  linux-gcc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: emscripten-core/setup-emsdk@v15   # build.sh then builds and tests IVGFiddle
      with:
        version: 6.0.10
        actions-cache-folder: emsdk-cache
    - name: Build & test
      shell: bash
      run: |
        bash build.sh 2>&1 | tee build.log
        grep -qF '=== ALL BUILDS AND TESTS COMPLETED SUCCESSFULLY ===' build.log
    # build.sh has just rebuilt tools/ivgfiddle/output, so any difference means the committed fiddle is stale. Rebuild
    # it with tools/ivgfiddle/buildIVGFiddle.sh and Emscripten 6.0.10 and commit the output.
    - name: Check that the committed IVGFiddle build is current
      shell: bash
      run: git diff --exit-code --stat -- tools/ivgfiddle/output
    - name: Replay the fuzz corpus
      shell: bash
      run: bash tools/replayFuzzCorpus.sh
    - name: Replay the fuzz inputs with sanitizers
      shell: bash
      run: bash tools/replayFuzzSanitized.sh
    - name: Compare the SIMD and scalar rasterizers on the fuzz inputs
      shell: bash
      run: bash tools/replaySIMDDiff.sh
