name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1        # sets up cl.exe for VS 2022 x64
    - name: Build & test
      shell: pwsh
      run: |
        .\build.cmd | Tee-Object -FilePath build.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (Select-String -LiteralPath build.log -SimpleMatch '=== ALL BUILDS AND TESTS COMPLETED SUCCESSFULLY ===' -Quiet)) {
          throw 'build.cmd exited 0 without printing the completion line'
        }

  macos-clang:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build & test
      shell: bash
      run: |
        bash build.sh 2>&1 | tee build.log
        grep -qF '=== ALL BUILDS AND TESTS COMPLETED SUCCESSFULLY ===' build.log
        
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: emscripten-core/setup-emsdk@v15   # build.sh then builds and tests IVGFiddle
      with:
        version: 6.0.10
    - name: Build & test
      shell: bash
      run: |
        bash build.sh 2>&1 | tee build.log
        grep -qF '=== ALL BUILDS AND TESTS COMPLETED SUCCESSFULLY ===' build.log
